    <style>
        /* iPad第10世代の4:3画面＆iOS Safariの下部バーによる余白を根絶するCSS */
        html, body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background: #050b0d; 
            width: 100vw; 
            height: 100vh;
            height: 100dvh; 
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation; 
            -webkit-overflow-scrolling: auto;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Roboto', 'Noto Sans JP', sans-serif;
            box-sizing: border-box;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; height: 100dvh; }
        
        /* --- Material 3 Design System --- */
        .m3-hud { background: rgba(15, 27, 33, 0.9); backdrop-filter: blur(20px); border-radius: 24px; color: #e1e3e5; padding: 14px 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); }
        .m3-dialog { background: #13222a; color: #e1e3e5; border-radius: 28px; box-shadow: 0px 16px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); }
        .m3-card { background: #1c2f38; border-radius: 16px; border: 1px solid #344851; }
        
        /* Buttons & Inputs */
        .m3-btn-primary { background: #7cd4ff; color: #003547; border-radius: 100px; font-weight: 700; transition: all 0.25s; padding: 14px 32px; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 8px; justify-content: center; touch-action: manipulation; pointer-events: auto; }
        .m3-btn-primary:hover { background: #b3e5ff; transform: scale(1.02); }
        .m3-btn-tonal { background: #2a3f48; color: #bbe6ff; border-radius: 100px; font-weight: 500; transition: all 0.2s; padding: 12px 28px; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; justify-content: center; touch-action: manipulation; pointer-events: auto; }
        .m3-btn-tonal:hover { background: #3a5460; }
        .m3-btn-icon { background: #13222a; color: #bbe6ff; border-radius: 100px; transition: all 0.2s; border: 1px solid #344851; z-index: 250; pointer-events: auto; touch-action: manipulation; }
        .m3-btn-icon:hover { background: #2a3f48; }
        .m3-input { background: #081014; border: 1px solid #717d84; color: #e1e3e5; border-radius: 12px; padding: 12px 16px; transition: all 0.2s; pointer-events: auto; }
        
        /* カモフラージュスマホデバイス */
        #youtube-device { position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%); width: 440px; height: 250px; border-radius: 36px; overflow: hidden; border: 12px solid #0f1b21; background: #fff; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .active-view { transform: translateX(-50%) translateY(-30px) scale(1.05); }
        #warning-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 20%, rgba(255, 50, 50, 0.5) 100%); opacity: 0; transition: opacity 0.15s; z-index: 40; }
        
        .m3-overlay-screen { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: #04080a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; text-align: center; color: #e1e3e5; padding: 40px; box-sizing: border-box; }
        
        #gemini-ai-trigger {
            position: absolute; bottom: 40px; right: 40px; height: 64px; padding: 0 28px; border-radius: 32px;
            background: linear-gradient(45deg, #1a73e8, #9333ea, #ff7300, #1a73e8); background-size: 300% 300%;
            animation: geminiGradient 6s ease infinite; z-index: 90; pointer-events: auto; box-shadow: 0 8px 32px rgba(147, 51, 234, 0.4);
            display: flex; align-items: center; gap: 12px; color: white; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); font-weight: 700; font-size: 1.05rem; touch-action: manipulation;
        }
        #gemini-ai-trigger.click-pop { transform: scale(0.85) translateY(10px); opacity: 0.6; }
        @keyframes geminiGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* Ami AI サイドバー */
        #ai-dock { 
            position: absolute; top: 0; right: 0; width: 420px; height: 100%; height: 100dvh;
            background: rgba(19, 34, 42, 0.96); backdrop-filter: blur(24px);

        /* ログコンテナの不透明度とトランジションをより安定化 */
        #boot-log-container { font-family: 'Roboto Mono', monospace; font-size: 13px; color: #7cd4ff; text-align: left; width: 100%; max-width: 500px; height: 120px; overflow: hidden; margin-bottom: 20px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px; border: 1px solid rgba(124, 212, 255, 0.2); transition: opacity 0.3s ease; opacity: 1; }

        .boot-scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; z-index: 510; pointer-events: none; }
        .pulse-alert { animation: redAlertEffect 0.5s ease-out 1; }
        @keyframes redAlertEffect { 0% { background-color: #050b0d; } 50% { background-color: #1e080a; } 100% { background-color: #050b0d; } }
    </style>
</head>

    <script>
        const GEMINI_API_KEY = "AIzaSyAorKSTtiQBjrzf556ZaiW_7bmqKHJKGmo";
        let initialCamo = "math";

        function getUserName() {
            const savedName = localStorage.getItem('userNickname');
            return savedName && savedName.trim() !== "" ? savedName.trim() : "お前";
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log("Service Worker Active", reg))
                .catch(err => console.error("SW Register Fail: ", err));
            });
        }

        let lastTouchEnd = 0;
        document.documentElement.addEventListener('touchend', (event) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { event.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        const logLines = [
            "CRITICAL: MONITORING CORE INITIALIZED V3.2...",
            "LOADING CLASSROOM DATA STRUCTURES [OK]",
            "SETTING CAMERA CLIPPING PLANE SAFE-ZONE...",
            "FIXING SENSEI MESH COORDINATES TO ORIGIN [OK]",
            "CONNECTING TO AMI AI INTERACTION HUB...",
            "WARNING: HIGH REALISM LIGHTING APPLIED.",
            "READY TO INITIATE INTENSE STUDY ENVIRONMENT."
        ];

        // 🛠️ 【超重要】詰まりバグを完全に破壊した新・起動シーケンス
        function runBootSequence() {
            const container = document.getElementById('start-screen');
            const logBox = document.getElementById('boot-log-text');
            const logContainer = document.getElementById('boot-log-container');
            const content = document.getElementById('boot-content');
            
            // 初期の表示不整合を防ぐため、強制的にコンテツを非表示にしてログを開始
            content.style.opacity = "0";
            container.classList.add('pulse-alert');

            let lineIndex = 0;
            function printLine() {
                if (lineIndex < logLines.length) {
                    const line = document.createElement('div');
                    line.className = "mb-1 text-xs font-mono tracking-wider";
                    line.innerText = `> ${logLines[lineIndex]}`;
                    logBox.appendChild(line);
                    logContainer.scrollTop = logContainer.scrollHeight;
                    lineIndex++;
                    setTimeout(printLine, 80);
                } else {
                    // 全ログ出力後、確実にログ枠を非表示にしてメインUIを浮き上がらせる
                    setTimeout(() => {
                        logContainer.style.opacity = "0";
                        setTimeout(() => {
                            logContainer.style.display = 'none';
                            content.style.opacity = "1";
                            // 通知許可がすでに下りている場合は、最初から入室ボタンを活性化させる親切設計
                            if (Notification.permission === 'granted') {
                                activateStartButton();
                            }
                        }, 300);
                    }, 200);
                }
            }
            setTimeout(printLine, 100);
        }

        function activateStartButton() {
            const authBtn = document.getElementById('auth-btn');
            const startBtn = document.getElementById('start-btn');
            if(authBtn) authBtn.style.display = 'none';
            if(startBtn) {
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-40', 'pointer-events-none');
            }
        }

        // ポモドーロタイマーロジック
        let pomoMinutesStudy = 25;
        let pomoMinutesBreak = 5;
        let pomoSecondsLeft = pomoMinutesStudy * 60;
        let pomoTimerState = 'STUDY'; 
        let pomoIntervalId = null;

        const pomoScreen = document.getElementById('pomodoro-screen');
        const pomoClock = document.getElementById('pomo-clock');
        const pomoStartPauseBtn = document.getElementById('pomo-start-pause-btn');
        const pomoCtrlIcon = document.getElementById('pomo-ctrl-icon');
        const pomoBadge = document.getElementById('pomo-status-badge');

        function updatePomoClockUI() {
            const m = Math.floor(pomoSecondsLeft / 60).toString().padStart(2, '0');
            const s = (pomoSecondsLeft % 60).toString().padStart(2, '0');
            pomoClock.innerText = `${m}:${s}`;
        }

        function togglePomoTimer() {
            const userName = getUserName();
            if (pomoIntervalId) {
                clearInterval(pomoIntervalId);
                pomoIntervalId = null;
                pomoCtrlIcon.innerText = 'play_arrow';
            } else {
                pomoCtrlIcon.innerText = 'pause';
                pomoIntervalId = setInterval(() => {
                    if (pomoSecondsLeft > 0) {
                        pomoSecondsLeft--;
                        updatePomoClockUI();
                    } else {
                        clearInterval(pomoIntervalId);
                        pomoIntervalId = null;
                        pomoCtrlIcon.innerText = 'play_arrow';
                        
                        if (pomoTimerState === 'STUDY') {
                            pomoTimerState = 'BREAK';
                            pomoSecondsLeft = pomoMinutesBreak * 60;

        function updateAI() {
            if (!sensei) return;
            const time = Date.now() * 0.004; aiTimer -= 1;
            
            if (aiState === 'WALK') {
                let dist = sensei.position.distanceTo(aiTarget);
                if (dist > 0.3) {
                    let dir = aiTarget.clone().sub(sensei.position).normalize();
                    sensei.position.add(dir.multiplyScalar(0.035));
                    sensei.rotation.y = THREE.MathUtils.lerp(sensei.rotation.y, Math.atan2(dir.x, dir.z), 0.15);
                    sensei.legL.rotation.x = Math.sin(time * 1.5) * 0.4; sensei.legR.rotation.x = Math.cos(time * 1.5) * 0.4;
                } else { 
                    aiState = 'INSPECT'; 
                    aiTimer = 60 + Math.random() * 80; 
                }
            } else if (aiState === 'INSPECT') {
                sensei.legL.rotation.x = 0; sensei.legR.rotation.x = 0;
                sensei.head.rotation.y = Math.sin(time * 0.5) * 0.8;
                if (aiTimer <= 0) { 
                    aiState = 'WALK'; 
                    aiTarget.set((Math.random() - 0.5) * 8, 0.25, -10 + (Math.random() - 0.5) * 1); 
                }
            }

            const playerPos = new THREE.Vector3(0, 0, 4);
            const dist = sensei.position.distanceTo(playerPos);
            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(sensei.head.getWorldQuaternion(new THREE.Quaternion()));
            const dot = forward.dot(playerPos.clone().sub(sensei.position).normalize());

            if (isWatching) {
                score += 1; document.getElementById('score-text').innerText = score.toString().padStart(4, '0');
                document.getElementById('yt-progress').style.width = (score % 100) + "%";
                
                if (dot > 0.2 && dist < 18) {
                    suspicion += 2.5; 
                    document.getElementById('warning-vignette').style.opacity = "1";
                    if(sensei.eyes) sensei.eyes.forEach(e => e.material.color.setHex(0xff0000));
                    sensei.head.rotation.x = -0.1;
                } else {
                    suspicion = Math.max(0, suspicion - 0.5); 
                    document.getElementById('warning-vignette').style.opacity = "0";
                    if(sensei.eyes) sensei.eyes.forEach(e => e.material.color.setHex(0x000000));
                }
            } else {
                suspicion = Math.max(0, suspicion - 1.2); 
                document.getElementById('warning-vignette').style.opacity = "0";
                if(sensei.eyes) sensei.eyes.forEach(e => e.material.color.setHex(0x000000));
            }
            
            document.getElementById('suspicion-bar').style.width = suspicion + "%";
            if (suspicion >= 100) gameOver();
        }

        function animate() { requestAnimationFrame(animate); if (gameActive) updateAI(); renderer.render(scene, camera); }
        
        function gameOver() {
            gameActive = false; 
            const userName = getUserName();
            const startScreen = document.getElementById('start-screen');
            startScreen.style.display = 'flex';
            document.getElementById('boot-content').style.opacity = "1";
            document.getElementById('boot-title').innerText = "DISMISSED";
            document.getElementById('boot-sub').innerHTML = `<span class='text-red-500 font-black text-3xl'>Score: ${score}</span><br><br>大網先生「...おい${userName}、ペンが完全に止まっているぞ。荷物をまとめて今すぐ出ていけ！」`;
            
            const startBtn = document.getElementById('start-btn');
            startBtn.innerHTML = `<span class="material-icons-outlined">refresh</span>反省して再入室`; 
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-40', 'pointer-events-none');
            
            const authBtn = document.getElementById('auth-btn');
            if (authBtn) authBtn.style.display = 'none';

            isWatching = false;
        }

        document.getElementById('start-btn').onclick = () => { score = 0; suspicion = 0; gameActive = true; document.getElementById('start-screen').style.display = 'none'; };
        document.getElementById('auth-btn').onclick = function() { Notification.requestPermission().then(p => { if(p==='granted') { activateStartButton(); } }); };
        window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
        window.onload = init3D;
    </script>
</body>
</html>
