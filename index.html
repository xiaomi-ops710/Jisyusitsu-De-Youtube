    <style>

        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
        
        /* --- Material 3 iPad Optimized Blue System --- */

        .m3-btn-primary:hover { background: #b3e5ff; transform: scale(1.02); }
        .m3-btn-tonal { background: #334a54; color: #bbe6ff; border-radius: 100px; font-weight: 500; transition: all 0.2s; padding: 12px 28px; font-size: 1rem; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .m3-btn-tonal:hover { background: #455f6b; }
        .m3-btn-icon { background: #1a2c34; color: #bbe6ff; border-radius: 100px; transition: all 0.2s; border: 1px solid #404e56; z-index: 250; pointer-events: auto; }
        .m3-btn-icon:hover { background: #334a54; }
        
        .m3-input { background: #0b151a; border: 1px solid #8a9296; color: #e1e3e5; border-radius: 8px; padding: 10px 14px; transition: all 0.2s; }
        
        #youtube-device { position: absolute; bottom: 290px; left: 50%; transform: translateX(-50%); width: 460px; height: 260px; border-radius: 32px; overflow: hidden; border: 12px solid #132026; background: #fff; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); transition: transform 0.15s ease-out; }
        .active-view { transform: translateX(-50%) translateY(-20px) scale(1.03); }
        #warning-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 30%, rgba(255, 180, 180, 0.4) 100%); opacity: 0; transition: opacity 0.2s; z-index: 40; }
        
        .m3-overlay-screen { position: absolute; inset: 0; background: #050b0d; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; color: #e1e3e5; padding: 40px; }
        
        /* 🎨 Gemini風グラデーション：文字追加＆横長化バージョン */
        #gemini-ai-trigger {
            position: absolute; bottom: 40px; right: 40px; height: 64px; padding: 0 28px; border-radius: 32px;
            background: linear-gradient(45deg, #1a73e8, #9333ea, #ff7300, #1a73e8); background-size: 300% 300%;
            animation: geminiGradient 6s ease infinite; z-index: 90; pointer-events: auto; box-shadow: 0 8px 32px rgba(147, 51, 234, 0.4);
            display: flex; align-items: center; gap: 12px; color: white; transition: transform 0.2s; font-weight: 700; font-size: 1.05rem;
        }
        #gemini-ai-trigger:hover { transform: scale(1.05); }
        @keyframes geminiGradient {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        
        /* 📱 iPad向け：右側縦長型 Ami AI サイドバー */
        #ai-dock { 
            position: absolute; top: 0; right: 0; width: 420px; height: 100%; 
            background: rgba(26, 44, 52, 0.95); backdrop-filter: blur(20px);
            z-index: 150; border-left: 1px solid rgba(255,255,255,0.1); 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        .ai-collapsed { transform: translateX(420px); } /* 最初から画面外へ完全に隠す */
        .vertical-text { writing-mode: vertical-rl; text-orientation: upright; }

        /* 🎬 起動演出用 */
        #boot-log-container { font-family: 'Roboto Mono', monospace; font-size: 13px; color: #7cd4ff; text-align: left; width: 100%; max-width: 500px; height: 120px; overflow: hidden; margin-bottom: 20px; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border: 1px solid rgba(124, 212, 255, 0.2); }
        .glitch-title { font-size: 4rem; font-weight: 900; font-style: italic; letter-spacing: -2px; color: #ffffff; text-shadow: 0 0 10px rgba(124,212,255,0.5); display: none; margin-bottom: 8px; }
        .boot-scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 6px 100%; z-index: 110; pointer-events: none; }
        .pulse-alert { animation: redAlertEffect 0.6s ease-out 3; }
        @keyframes redAlertEffect {
            0% { background-color: #0b151a; } 50% { background-color: #401015; } 100% { background-color: #0b151a; }
        }
    </style>
</head>

    <script>
        // --- 本格ゲーム起動アニメーション演出システム ---
        const logLines = [
            "CRITICAL: SECURITY BREACH DETECTED...",
            "INITIALIZING OAMI MONITORING CORE V3...",
            "LOADING CLASSROOM 3D ENVIRONMENT [OK]",
            "GENERATING STUDENT TEXTURE MESHES [OK]",
            "CONNECTING TO AMI AI BRAIN SYSTEM...",
            "SYNCHRONIZING RECENT ANGER BADGES...",
            "WARNING: SENSEI'S VISION IS FULLY CHARGED.",
            "READY FOR APP INTRUSION OVERLAY."
        ];

        function runBootSequence() {
            const container = document.getElementById('start-screen');
            const logBox = document.getElementById('boot-log-text');
            container.classList.add('pulse-alert');

            let lineIndex = 0;
            function printLine() {
                if (lineIndex < logLines.length) {
                    const line = document.createElement('div');
                    line.className = "mb-1 text-xs font-mono tracking-wider";
                    line.innerText = `> ${logLines[lineIndex]}`;
                    logBox.appendChild(line);
                    document.getElementById('boot-log-container').scrollTop = document.getElementById('boot-log-container').scrollHeight;
                    lineIndex++;
                    setTimeout(printLine, 250);
                } else {
                    setTimeout(() => {
                        document.getElementById('boot-log-container').style.display = 'none';
                        document.getElementById('boot-emoji').classList.remove('opacity-0');
                        const title = document.getElementById('boot-title');
                        title.style.display = 'block';
                        
                        let f = 0;
                        const interval = setInterval(() => {
                            title.style.opacity = (f % 2 === 0) ? '0.3' : '1';
                            if(f++ > 5) {
                                clearInterval(interval);
                                title.style.opacity = '1';
                                document.getElementById('boot-sub').classList.remove('opacity-0');
                                const actions = document.getElementById('boot-actions');
                                actions.classList.remove('opacity-0', 'pointer-events-none');
                            }
                        }, 60);
                    }, 400);
                }
            }
            setTimeout(printLine, 600);
        }

        // --- ポモドーロタイマーロジック ---
        let timerState = 'STUDY';
        let timerSecondsLeft = 30 * 60;
        let studyMinutes = 30;
        let breakMinutes = 5;

        function updateTimerUI() {
            const mins = Math.floor(timerSecondsLeft / 60).toString().padStart(2, '0');
            const secs = (timerSecondsLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;
            const label = document.getElementById('timer-label');
            if(timerState === 'STUDY') {
                label.innerText = "自習中"; label.style.color = "#51daff";
            } else {
                label.innerText = "休憩タイム"; label.style.color = "#4ade80";
            }
        }

        setInterval(() => {
            if (gameActive && !isWatching && timerSecondsLeft > 0) {
                timerSecondsLeft--;
                updateTimerUI();
                if(timerSecondsLeft === 0) {
                    if(timerState === 'STUDY') {
                        timerState = 'BREAK'; timerSecondsLeft = breakMinutes * 60;
                        alert("大網先生「よし、時間だ。5分間の休憩を許可する」");
                    } else {
                        timerState = 'STUDY'; timerSecondsLeft = studyMinutes * 60;
                        alert("大網先生「休憩終わりだ！直ちに自習を再開しろ！」");
                    }
                    updateTimerUI();
                }
            }
        }, 1000);

        // --- Badge API ---
        let offlineAngerCount = parseInt(localStorage.getItem('offlineAnger')) || 0;
        function updateAngerBadge(count) {
            if ('setAppBadge' in navigator) {
                if (count > 0) navigator.setAppBadge(count).catch(e => console.log(e));
                else navigator.clearAppBadge().catch(e => console.log(e));
            }
            localStorage.setItem('offlineAnger', count);
        }
        window.addEventListener('focus', () => {
            const lastTime = localStorage.getItem('lastActiveTime');
            if (lastTime) {
                const addedAnger = Math.floor((Date.now() - parseInt(lastTime)) / 30000);
                if (addedAnger > 0) { offlineAngerCount += addedAnger; updateAngerBadge(offlineAngerCount); }
            }
            if (offlineAngerCount > 0) {
                alert(`大網先生「私が不在の間、アイコンの怒りバッジが【${offlineAngerCount}】まで跳ね上がっているぞ。サボり魔め！」`);
                offlineAngerCount = 0; updateAngerBadge(0);
            }
        });
        window.addEventListener('blur', () => localStorage.setItem('lastActiveTime', Date.now().toString()));

        // Camo Screens
        const urlParams = new URLSearchParams(window.location.search);
        let initialCamo = urlParams.get('shortcut') || 'math';
        const camoTemplates = {
            math: `<div class="flex justify-between items-center border-b pb-1 mb-2"><span class="text-xs font-bold text-slate-400 flex items-center gap-0.5"><span class="material-icons-outlined text-sm">functions</span> Advanced Mathematics</span></div><div class="space-y-2 text-slate-600"><div class="h-2 w-full bg-slate-200 rounded"></div><div class="my-3 p-4 bg-slate-100 border rounded text-center font-serif text-slate-600 italic text-sm">f(x) = ∫[a,b] sin(x²) dx + cos(y)dy</div></div>`,
            studysapuri: `<div class="w-full h-full flex flex-col bg-slate-950 text-white p-0"><div class="bg-slate-900 px-4 py-2 flex items-center gap-2 text-xs font-bold border-b border-slate-800"><div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div><span>第4講 英文法の極意（特別配信）</span></div><div class="flex-grow flex bg-slate-900 items-center justify-center text-center font-bold text-cyan-400 text-sm animate-pulse">[ 講師：大網先生特選ゼミ ]</div></div>`,
            english: `<div class="flex justify-between items-center border-b pb-1 mb-2"><span class="text-xs font-bold text-slate-400">English Advanced Reading</span></div><div class="space-y-3 text-xs text-slate-700 font-serif"><p class="font-bold text-sm">The Paradigm Shift in Modern Education.</p><p>It is universally acknowledged that a dedicated, strict instructor fosters an unmatched environment for high-concentration study structures...</p></div>`,
            japanese: `<div class="w-full h-full flex flex-col bg-[#faf6ee] text-[#2b2b2b] p-3 font-serif"><div class="text-[10px] text-slate-400 border-b border-orange-200 pb-1 mb-2 flex justify-between"><span>芥川龍之介「羅生門」第一章</span></div><div class="flex flex-row-reverse justify-start h-full text-right"><p class="vertical-text text-sm leading-loose tracking-wide">ある日の暮方の事である。一人の下人が、羅生門の暮方を待っていた。</p></div></div>`
        };
        function setCamoScreen(type) {
            const container = document.getElementById('screen-study');
            if(container) container.innerHTML = camoTemplates[type];
            const radio = document.querySelector(`input[name="camo-select"][value="${type}"]`);
            if (radio) radio.checked = true;
        }

        // --- 🤖 Ami AI サイドバー＆Gemini風タイピング演出システム ---
        let selectedBase64Image = null;
        const aiTrigger = document.getElementById('gemini-ai-trigger');
        const aiDock = document.getElementById('ai-dock');
        const aiCloseBtn = document.getElementById('ai-close-sidebar');
        
        aiTrigger.onclick = (e) => { e.stopPropagation(); aiDock.classList.toggle('ai-collapsed'); };
        aiCloseBtn.onclick = () => aiDock.classList.add('ai-collapsed');

        document.getElementById('ai-file-input').onchange = (e) => {
            const file = e.target.files[0]; if (!file) return;
            document.getElementById('file-preview-name').innerText = `📎 ${file.name}`;
            document.getElementById('file-preview-name').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (evt) => selectedBase64Image = evt.target.result.split(',')[1];
            reader.readAsDataURL(file);
        };

        document.getElementById('save-settings-btn').onclick = () => {
            studyMinutes = parseInt(document.getElementById('timer-study-input').value) || 30;
            breakMinutes = parseInt(document.getElementById('timer-break-input').value) || 5;
            timerSecondsLeft = studyMinutes * 60; timerState = 'STUDY'; updateTimerUI();
            alert('大網先生「自習タイマーの周期を再同期した。一秒も無駄にするな」');
            document.getElementById('settings-dialog').classList.add('hidden');
        };

        // 📝 Gemini風文字タイピングエフェクト関数
        function typeWriterEffect(element, fullText, speed = 25) {
            let i = 0;
            element.innerHTML = ""; // 初期化
            function type() {
                if (i < fullText.length) {
                    // 改行コードをM3ログに正しく反映
                    if (fullText.substr(i, 4) === "<br>") {
                        element.innerHTML += "<br>"; i += 4;
                    } else if (fullText.charAt(i) === "\n") {
                        element.innerHTML += "<br>"; i++;
                    } else {
                        element.innerHTML += fullText.charAt(i); i++;
                    }
                    document.getElementById('ai-chat-log').scrollTop = document.getElementById('ai-chat-log').scrollHeight;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        document.getElementById('ai-send-btn').onclick = async () => {
            const textInput = document.getElementById('ai-text-input').value.trim();
            if (GEMINI_API_KEY === "ここにあなたのAPIキーを記述" || !GEMINI_API_KEY) { 
                alert('ソースコード22行目の GEMINI_API_KEY に正しいキーを記述してください。'); 
                return; 
            }
            if (!textInput && !selectedBase64Image) return;

            const chatLog = document.getElementById('ai-chat-log');
            const userMsgHtml = document.createElement('div'); userMsgHtml.className = "text-slate-400";
            userMsgHtml.innerText = `お前「${textInput || "（課題画像を提出）"}」`;
            chatLog.appendChild(userMsgHtml); document.getElementById('ai-text-input').value = "";

            const systemMsgHtml = document.createElement('div'); systemMsgHtml.className = "text-[#7cd4ff] animate-pulse font-bold";
            systemMsgHtml.innerText = "大網先生が答案の不備を精査中..."; chatLog.appendChild(systemMsgHtml);
            chatLog.scrollTop = chatLog.scrollHeight;

            const promptText = `あなたは非常に厳格で威圧的な、絶対に生徒のサボりを許さない伝説の塾講師「大網先生」です。ユーザー（塾生）からの質問・問題に対して、徹底的に正しく解説をしてください。その際、必ず以下のディレクションを守ること。
・口調は厳しく、少し怖め。二人称は「お前」か「貴様」。
・「こんな問題もわからないのか」「甘えるな」「自習室の帝王を舐めるな」といった説教を必ず織り交ぜる。
・解説自体は数学、国語、英語などどんな内容であっても、論理的かつ完璧に行うこと。
ユーザーの質問: ${textInput}`;

            let parts = [{ text: promptText }];
            if (selectedBase64Image) parts.push({ inlineData: { mimeType: "image/jpeg", data: selectedBase64Image } });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });
                const data = await response.json();
                const replyText = data.candidates[0].content.parts[0].text;
                
                // アニメーションを解いてタイピング演出へ移管
                systemMsgHtml.classList.remove('animate-pulse'); 
                systemMsgHtml.className = "text-red-300 font-bold";
                
                // タイピング処理のキックオフ
                typeWriterEffect(systemMsgHtml, `大網先生「${replyText}`);
            } catch (err) {
                systemMsgHtml.className = "text-amber-400"; systemMsgHtml.innerText = "大網先生「通信エラーだ。貴様のキーの詰めが甘い！」";
            }
            selectedBase64Image = null; document.getElementById('file-preview-name').classList.add('hidden');
        };

        // --- 設定ダイアログ処理 ---
        document.getElementById('settings-toggle-btn').onclick = (e) => { e.stopPropagation(); document.getElementById('settings-dialog').classList.remove('hidden'); };
        document.getElementById('settings-close-btn').onclick = () => document.getElementById('settings-dialog').classList.add('hidden');
        document.querySelectorAll('input[name="camo-select"]').forEach(radio => {
            radio.addEventListener('change', (e) => setCamoScreen(e.target.value));
        });

        // --- Three.js グラフィック（リアル学校の教室化） ---
        let scene, camera, renderer, sensei, students = [];
        let gameActive = false, isWatching = false, score = 0, suspicion = 0;
        let aiTarget = new THREE.Vector3(0, 0, -8);
        let aiState = 'WALK'; let aiTimer = 0;

        function createPatternTexture(type, baseColorStr, patternColorStr) {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = baseColorStr; ctx.fillRect(0,0,64,64); ctx.fillStyle = patternColorStr;
            if(type === 'striped') { ctx.fillRect(0,0,64,12); ctx.fillRect(0,32,64,12); } 
            else if(type === 'checked') { ctx.fillRect(0,0,32,32); ctx.fillRect(32,32,32,32); }
            return new THREE.CanvasTexture(canvas);
        }

        function createDetailedPerson(isSensei = false) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe0bd, roughness: 0.6 });
            let clothMat = isSensei ? new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.7 }) : new THREE.MeshStandardMaterial({ map: createPatternTexture('checked', `hsl(${Math.random()*360}, 60%, 45%)`, '#222'), roughness: 0.8 });

            const torso = new THREE.Group();
            const chest = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.4, 0.3), clothMat); chest.position.y = 1.25;
            const waist = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.4, 0.25), new THREE.MeshStandardMaterial({color:0x333333})); waist.position.y = 0.95;
            torso.add(chest, waist); group.add(torso);

            if (isSensei) {
                const shirt = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.3, 0.05), new THREE.MeshStandardMaterial({ color: 0xffffff })); shirt.position.set(0, 1.35, 0.15);
                const tie = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.25, 0.02), new THREE.MeshStandardMaterial({ color: 0xdd2222 })); tie.position.set(0, 1.25, 0.16);
                torso.add(shirt, tie);
            }

            group.armL = new THREE.Group(); group.armR = new THREE.Group();
            const upperArm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.4, 0.16), clothMat); upperArm.position.y = -0.2;
            group.armL.add(upperArm.clone()); group.armL.position.set(-0.35, 1.45, 0);
            group.armR.add(upperArm.clone()); group.armR.position.set(0.35, 1.45, 0);
            group.add(group.armL, group.armR);

            const createLeg = (side) => {
                const leg = new THREE.Group();
                const pant = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x111111 })); pant.position.y = -0.25;
                leg.add(pant); leg.position.set(side * 0.15, 0.8, 0); return leg;
            };
            group.legL = createLeg(-1); group.legR = createLeg(1); group.add(group.legL, group.legR);

            const headGroup = new THREE.Group();
            const skull = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 16), skinMat); skull.scale.set(0.9, 1.1, 1); headGroup.add(skull);
            
            if (isSensei) {
                const eyeGeo = new THREE.SphereGeometry(0.03, 8, 8); const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.08, 0.05, 0.18);
                const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.08, 0.05, 0.18);
                headGroup.add(eL, eR); group.eyes = [eL, eR];
            } else {
                const hairGeo = new THREE.SphereGeometry(0.23, 16, 16, 0, Math.PI * 2, 0, Math.PI / 1.7);
                const hair = new THREE.Mesh(hairGeo, new THREE.MeshStandardMaterial({ color: 0x221100, roughness: 0.9 })); hair.scale.set(1.02, 1.05, 1.05); headGroup.add(hair);
            }
            headGroup.position.y = 1.6; group.add(headGroup); group.head = headGroup;
            return group;
        }

        function init() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0xddeeff); scene.fog = new THREE.Fog(0xddeeff, 10, 45);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 2.3, 7.0); camera.lookAt(0, 1.1, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const mainLight = new THREE.DirectionalLight(0xfffaed, 0.8); mainLight.position.set(10, 20, 8); scene.add(mainLight);

            const floorCanvas = document.createElement('canvas'); floorCanvas.width = 256; floorCanvas.height = 256;
            const fCtx = floorCanvas.getContext('2d'); fCtx.fillStyle = '#dfb78c'; fCtx.fillRect(0,0,256,256); fCtx.fillStyle = '#c59b6d';
            for(let i=0; i<256; i+=32) { fCtx.fillRect(i, 0, 2, 256); }
            const floorTex = new THREE.CanvasTexture(floorCanvas); floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(10,10);
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.4 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshStandardMaterial({ color: 0xeceae4, roughness: 0.9 })); backWall.position.set(0, 10, -20); scene.add(backWall);
            const blackboard = new THREE.Mesh(new THREE.BoxGeometry(14, 4, 0.1), new THREE.MeshStandardMaterial({ color: 0x1e3f20, roughness: 0.7 })); blackboard.position.set(0, 3, -19.8); scene.add(blackboard);

            const deskMat = new THREE.MeshStandardMaterial({ color: 0xb58a55, roughness: 0.5 });
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.6 });
            
            for (let x = -8; x <= 8; x += 4) {
                for (let z = -12; z <= 4; z += 4) {
                    const deskGroup = new THREE.Group();
                    const top = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.08, 1.4), deskMat); top.position.y = 0.9; deskGroup.add(top);
                    const legGeo = new THREE.BoxGeometry(0.06, 0.9, 0.06);
                    const l1 = new THREE.Mesh(legGeo, pipeMat); l1.position.set(-1.1, 0.45, -0.6); deskGroup.add(l1);
                    const l2 = new THREE.Mesh(legGeo, pipeMat); l2.position.set(1.1, 0.45, -0.6); deskGroup.add(l2);
                    deskGroup.position.set(x, 0, z); scene.add(deskGroup);
                    if (x !== 0 || z !== 4) {
                        const s = createDetailedPerson(false); s.position.set(x, 0, z + 1.1); s.rotation.y = Math.PI; s.head.rotation.x = 0.4; scene.add(s); students.push(s);
                    }
                }
            }

            sensei = createDetailedPerson(true); sensei.position.set(0, 0, -14); scene.add(sensei);
            setCamoScreen(initialCamo); updateTimerUI();

            const startAction = (e) => {
                if (!gameActive || e.target.closest('#settings-toggle-btn') || e.target.closest('#settings-dialog') || e.target.closest('#ai-dock') || e.target.closest('#gemini-ai-trigger')) return;
                isWatching = true; document.getElementById('screen-study').classList.add('hidden'); document.getElementById('screen-youtube').classList.remove('hidden'); document.getElementById('youtube-device').classList.add('active-view');
            };
            const stopAction = (e) => {
                if (e.target.closest('#settings-toggle-btn') || e.target.closest('#settings-dialog') || e.target.closest('#ai-dock') || e.target.closest('#gemini-ai-trigger')) return;
                isWatching = false; document.getElementById('screen-study').classList.remove('hidden'); document.getElementById('screen-youtube').classList.add('hidden'); document.getElementById('youtube-device').classList.remove('active-view');
            };
            window.addEventListener('mousedown', startAction); window.addEventListener('mouseup', stopAction);
            window.addEventListener('touchstart', startAction); window.addEventListener('touchend', stopAction);
            
            runBootSequence();
            animate();
        }

        function updateAI() {
            const time = Date.now() * 0.005; aiTimer -= 1;
            if (aiState === 'WALK') {
                let dist = sensei.position.distanceTo(aiTarget);
                if (dist > 0.3) {
                    let dir = aiTarget.clone().sub(sensei.position).normalize();
                    sensei.position.add(dir.multiplyScalar(0.045));
                    sensei.rotation.y = THREE.MathUtils.lerp(sensei.rotation.y, Math.atan2(dir.x, dir.z), 0.1);
                    sensei.legL.rotation.x = Math.sin(time) * 0.45; sensei.legR.rotation.x = Math.cos(time) * 0.45;
                } else { aiState = 'INSPECT'; aiTimer = 80 + Math.random() * 120; }
            } else if (aiState === 'INSPECT') {
                sensei.legL.rotation.x = 0; sensei.legR.rotation.x = 0;
                sensei.head.rotation.y = Math.sin(time * 0.4) * 1.3;
                if (aiTimer <= 0) { aiState = 'WALK'; aiTarget.set((Math.random() - 0.5) * 12, 0, (Math.random() - 0.5) * 18 - 4); }
            }

            const playerPos = new THREE.Vector3(0, 0, 5);
            const dist = sensei.position.distanceTo(playerPos);
            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(sensei.head.getWorldQuaternion(new THREE.Quaternion()));
            const dot = forward.dot(playerPos.clone().sub(sensei.position).normalize());

            if (isWatching) {
                score += 1; document.getElementById('score-text').innerText = score.toString().padStart(4, '0');
                document.getElementById('yt-progress').style.width = (score % 100) + "%";
                if (dot > 0.4 && dist < 15) {
                    suspicion += 2.5; document.getElementById('warning-vignette').style.opacity = "1";
                    sensei.eyes.forEach(e => e.material.color.set(0xff2222));
                } else {
                    suspicion = Math.max(0, suspicion - 0.3); document.getElementById('warning-vignette').style.opacity = "0";
                    sensei.eyes.forEach(e => e.material.color.set(0x000000));
                }
            } else {
                suspicion = Math.max(0, suspicion - 1.2); document.getElementById('warning-vignette').style.opacity = "0";
                sensei.eyes.forEach(e => e.material.color.set(0x000000));
            }
            document.getElementById('suspicion-bar').style.width = suspicion + "%";
            if (suspicion >= 100) gameOver();
        }

        function animate() { requestAnimationFrame(animate); if (gameActive) updateAI(); renderer.render(scene, camera); }
        
        function gameOver() {
            gameActive = false; document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('boot-title').innerText = "DISMISSED";
            document.getElementById('boot-sub').innerHTML = `<span class='text-red-400 font-black text-3xl'>Score: ${score}</span><br><br>大網先生「...お前、そこまでして動画が見たいか？」`;
            document.getElementById('start-btn').innerHTML = `<span class="material-icons-outlined">refresh</span>反省して再入室`; isWatching = false;
        }

        document.getElementById('start-btn').onclick = () => { score = 0; suspicion = 0; gameActive = true; document.getElementById('start-screen').style.display = 'none'; };
        document.getElementById('auth-btn').onclick = function() { Notification.requestPermission().then(p => { if(p==='granted') { document.getElementById('start-btn').disabled=false; document.getElementById('start-btn').classList.remove('opacity-40'); this.style.display='none'; } }); };
        window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
        window.onload = init;
    </script>
</body>
</html>
