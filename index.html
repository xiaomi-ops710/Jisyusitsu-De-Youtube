    <script>
        const GEMINI_API_KEY = "AIzaSyA9eQLOWdnG7PQxVOd9c8-htnxhSqbvP6w";
        let initialCamo = "math";

        // --- 🔊 Web Audio API リアルタイム効果音生成システム ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 定番のタップ音
        function playSoundTap() {
            initAudio(); if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        // サボり中（YouTube再生中）のチープなBGM波形ループ
        let bleepInterval = null;
        function startSaboriSound() {
            initAudio(); if (!audioCtx || bleepInterval) return;
            bleepInterval = setInterval(() => {
                if(!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                const notes = [261.6, 329.6, 392.0, 523.3]; // C, E, G, C
                const randomNote = notes[Math.floor(Math.random() * notes.length)];
                osc.frequency.setValueAtTime(randomNote, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }, 140);
        }

        function stopSaboriSound() {
            if (bleepInterval) { clearInterval(bleepInterval); bleepInterval = null; }
        }

        // 大網先生に見つかっている瞬間の警告不協和音
        let dangerSoundOsc1 = null, dangerSoundOsc2 = null, dangerGain = null;
        function startDangerAlarm() {
            initAudio(); if (!audioCtx || dangerSoundOsc1) return;
            dangerSoundOsc1 = audioCtx.createOscillator();
            dangerSoundOsc2 = audioCtx.createOscillator();
            dangerGain = audioCtx.createGain();
            
            dangerSoundOsc1.type = 'sawtooth';
            dangerSoundOsc1.frequency.setValueAtTime(95, audioCtx.currentTime);
            dangerSoundOsc2.type = 'sawtooth';
            dangerSoundOsc2.frequency.setValueAtTime(99, audioCtx.currentTime); // わずかにずらして不協和音を生成
            
            dangerGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            
            dangerSoundOsc1.connect(dangerGain);
            dangerSoundOsc2.connect(dangerGain);
            dangerGain.connect(audioCtx.destination);

                    deskGroup.position.set(x, 0, z); scene.add(deskGroup);
                    
                    if (Math.abs(x) > 0.5 || z < -1) {
                        const s = createDetailedPerson(false); 
                        s.position.set(x, 0, z + 0.8); 
                        s.rotation.y = Math.PI; 
                        s.head.rotation.x = 0.3;
                        scene.add(s); 
                        students.push(s);
                    }
                }
            }

            sensei = createDetailedPerson(true); 
            sensei.position.set(0, 0.25, -10); 
            scene.add(sensei);
            
            setCamoScreen(initialCamo);
            const savedName = localStorage.getItem('userNickname');
            if (savedName) document.getElementById('user-nickname-input').value = savedName;
            updatePomoClockUI();

            // 🔊 画面ホールド操作（サボる／戻る）時の音響トリガー
            const startAction = (e) => {
                if (!gameActive || e.target.closest('#settings-toggle-btn') || e.target.closest('#settings-dialog') || e.target.closest('#ai-dock') || e.target.closest('#gemini-ai-trigger') || e.target.closest('#pomodoro-toggle-btn') || e.target.closest('#pomodoro-screen')) return;
                initAudio();
                isWatching = true; 
                document.getElementById('screen-study').classList.add('hidden'); 
                document.getElementById('screen-youtube').classList.remove('hidden'); 
                document.getElementById('youtube-device').classList.add('active-view');
                startSaboriSound();
            };
            const stopAction = (e) => {
                if (e.target.closest('#settings-toggle-btn') || e.target.closest('#settings-dialog') || e.target.closest('#ai-dock') || e.target.closest('#gemini-ai-trigger') || e.target.closest('#pomodoro-toggle-btn') || e.target.closest('#pomodoro-screen')) return;
                isWatching = false; 
                document.getElementById('screen-study').classList.remove('hidden'); 
                document.getElementById('screen-youtube').classList.add('hidden'); 
                document.getElementById('youtube-device').classList.remove('active-view');
                stopSaboriSound();
                stopDangerAlarm();
            };
            window.addEventListener('mousedown', startAction); window.addEventListener('mouseup', stopAction);
            window.addEventListener('touchstart', startAction, { passive: true }); window.addEventListener('touchend', stopAction, { passive: true });
            
            runBootSequence(); animate();
        }

        function updateAI() {
            if (!sensei) return;
            const time = Date.now() * 0.004; aiTimer -= 1;
            
            if (aiState === 'WALK') {
                let dist = sensei.position.distanceTo(aiTarget);
                if (dist > 0.4) {
                    let dir = aiTarget.clone().sub(sensei.position).normalize();
                    sensei.position.add(dir.multiplyScalar(0.038));
                    sensei.rotation.y = THREE.MathUtils.lerp(sensei.rotation.y, Math.atan2(dir.x, dir.z), 0.15);
                    sensei.legL.rotation.x = Math.sin(time * 1.6) * 0.45; sensei.legR.rotation.x = Math.cos(time * 1.6) * 0.45;
                } else { 
                    aiState = 'INSPECT'; 
                    aiTimer = 50 + Math.random() * 70; 
                }
            } else if (aiState === 'INSPECT') {
                sensei.legL.rotation.x = 0; sensei.legR.rotation.x = 0;
                sensei.head.rotation.y = Math.sin(time * 0.6) * 0.7;
                if (aiTimer <= 0) { 
                    aiState = 'WALK'; 
                    let targetX = (Math.random() - 0.5) * 9; 
                    let targetZ = -10 + (Math.random() * 13); 
                    aiTarget.set(targetX, 0.25, targetZ); 
                }
            }

            const playerPos = new THREE.Vector3(0, 0, 4);
            const dist = sensei.position.distanceTo(playerPos);
            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(sensei.head.getWorldQuaternion(new THREE.Quaternion()));
            const dot = forward.dot(playerPos.clone().sub(sensei.position).normalize());

            if (isWatching) {
                score += 1; document.getElementById('score-text').innerText = score.toString().padStart(4, '0');
                document.getElementById('yt-progress').style.width = (score % 100) + "%";
                
                let detectRadius = dist < 6 ? 0.05 : 0.2; 
                if (dot > detectRadius && dist < 18) {
                    suspicion += dist < 6 ? 4.0 : 2.2;
                    document.getElementById('warning-vignette').style.opacity = "1";
                    if(sensei.eyes) sensei.eyes.forEach(e => e.material.color.setHex(0xff0000));
                    sensei.head.rotation.x = -0.15;
                    startDangerAlarm(); // 🔊 視線が合っている最中のアラーム
                } else {
                    suspicion = Math.max(0, suspicion - 0.5); 
                    document.getElementById('warning-vignette').style.opacity = "0";
                    if(sensei.eyes) sensei.eyes.forEach(e => e.material.color.setHex(0x000000));
                    stopDangerAlarm();
                }
            } else {
                suspicion = Math.max(0, suspicion - 1.2); 
                document.getElementById('warning-vignette').style.opacity = "0";
                if(sensei.eyes) sensei.eyes.forEach(e => e.material.color.setHex(0x000000));
                stopDangerAlarm();
            }
            
            document.getElementById('suspicion-bar').style.width = suspicion + "%";
            if (suspicion >= 100) gameOver();
        }

        function animate() { requestAnimationFrame(animate); if (gameActive) updateAI(); renderer.render(scene, camera); }
        
        function gameOver() {
            gameActive = false; 
            playSoundGameOver(); // 🔊 ゲームオーバー音
            const userName = getUserName();
            const startScreen = document.getElementById('start-screen');
            startScreen.style.display = 'flex';
            document.getElementById('boot-content').style.opacity = "1";
            document.getElementById('boot-title').innerText = "DISMISSED";
            document.getElementById('boot-sub').innerHTML = `<span class='text-red-500 font-black text-3xl'>Score: ${score}</span><br><br>大網先生「...おい${userName}、そこまでして動画が見たいか？ 荷物をまとめて今すぐ出ていけ！」`;
            
            const startBtn = document.getElementById('start-btn');
            startBtn.innerHTML = `<span class="material-icons-outlined">refresh</span>反省して再入室`; 
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-40', 'pointer-events-none');
            
            const authBtn = document.getElementById('auth-btn');
            if (authBtn) authBtn.style.display = 'none';

            isWatching = false;
        }

        document.getElementById('start-btn').onclick = () => { 
            initAudio(); playSoundTap(); 
            score = 0; suspicion = 0; gameActive = true; 
            document.getElementById('start-screen').style.display = 'none'; 
        };
        document.getElementById('auth-btn').onclick = function() { 
            initAudio(); playSoundTap();
            Notification.requestPermission().then(p => { if(p==='granted') activateStartButton(); }); 
        };
        
        // 🛠️ リサイズ処理でアスペクト比と描画バッファのサイズをデバイスピクセル比に合わせて厳密に更新
        window.onresize = () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        };
        window.onload = init3D;
    </script>
</body>
</html>
